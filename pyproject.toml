[project]
name = "poster-write-off-bot"
version = "0.1.0"
description = "Telegram bot for write-offs via Poster POS API"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.7",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
